# Builds the app and publishes it to GitHub Pages at https://umr.grader.uz on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Set under Settings → Secrets and variables → Actions → Variables.
          VITE_REMINDER_ENDPOINT: ${{ vars.VITE_REMINDER_ENDPOINT }}
          VITE_PAYMENT_URL: ${{ vars.VITE_PAYMENT_URL }}
          VITE_ORDER_EMAIL: ${{ vars.VITE_ORDER_EMAIL }}
          VITE_ORDER_TELEGRAM: ${{ vars.VITE_ORDER_TELEGRAM }}
          VITE_EMOJI_PRICE_UZS: ${{ vars.VITE_EMOJI_PRICE_UZS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
