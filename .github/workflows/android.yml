# Builds the Google Play app (uz.umr.app) as a signed .aab. Run it from the Actions tab
# ("Build Android app" → Run workflow), then download the "umr-android" artifact.
name: Build Android app

on:
  # Any change to the Android files builds an unsigned copy, to check it still compiles.
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version code (a whole number, higher than the last upload)'
        required: true
        default: '1'
      versionName:
        description: 'Version name shown in the store'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Set version
        run: |
          if [ -n "${{ inputs.versionCode }}" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${{ inputs.versionCode }}/" app/build.gradle
            sed -i "s/versionName \"[^\"]*\"/versionName \"${{ inputs.versionName }}\"/" app/build.gradle
          fi
      - name: Write keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building UNSIGNED (fine as a check, not for Google Play). See android/README.md."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "UMR_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Build signed bundle and APK
        env:
          UMR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UMR_KEY_ALIAS: umr-upload
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: umr-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
